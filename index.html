<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>✨ Sparkle Cam ✨</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    font-family: 'Quicksand', sans-serif;
    background: linear-gradient(135deg, #ffe0f0 0%, #e8d5ff 50%, #d5f5ff 100%);
    height: 100%;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  .app {
    max-width: 430px;
    margin: 0 auto;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    background: rgba(255, 255, 255, 0.55);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 0 50px rgba(255, 182, 216, 0.35);
  }

  .header {
    padding: 12px 16px;
    text-align: center;
    background: linear-gradient(135deg, #ff9ed8, #c084fc, #7dd3fc);
    color: white;
    font-weight: 700;
    font-size: 19px;
    letter-spacing: 1px;
    flex-shrink: 0;
    box-shadow: 0 3px 14px rgba(255, 155, 217, 0.4);
    position: relative;
    overflow: hidden;
  }
  .header::after {
    content: '';
    position: absolute;
    top: -40%; left: -40%;
    width: 180%; height: 180%;
    background: radial-gradient(circle, rgba(255,255,255,0.25) 0%, transparent 60%);
    animation: shine 5s ease-in-out infinite;
  }
  @keyframes shine {
    0%, 100% { transform: translate(-20%, -20%) rotate(0deg); }
    50% { transform: translate(20%, 20%) rotate(180deg); }
  }
  .header h1 { position: relative; z-index: 1; text-shadow: 0 2px 6px rgba(0,0,0,0.12); }

  .screen-wrap {
    flex: 1;
    margin: 10px;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  .screen {
    flex: 1;
    background: #1e1626;
    border-radius: 22px;
    border: 4px solid #fff;
    overflow: hidden;
    position: relative;
    box-shadow: 0 6px 24px rgba(255, 150, 200, 0.4), inset 0 0 0 2px rgba(255,255,255,0.1);
    min-height: 0;
  }
  .screen video,
  .screen canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .screen video { z-index: 1; display: none; }
  .screen canvas { z-index: 2; display: block; }

  .placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 3;
    text-align: center;
    padding: 20px;
    background:
      radial-gradient(circle at 30% 20%, rgba(255, 182, 217, 0.15) 0%, transparent 50%),
      radial-gradient(circle at 70% 80%, rgba(192, 132, 252, 0.15) 0%, transparent 50%),
      #1e1626;
  }
  .placeholder .ico {
    font-size: 64px;
    margin-bottom: 12px;
    animation: floaty 3s ease-in-out infinite;
    filter: drop-shadow(0 0 24px rgba(255, 182, 217, 0.7));
  }
  @keyframes floaty {
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50% { transform: translateY(-14px) rotate(2deg); }
  }
  .placeholder h3 { color: #fff5fa; font-size: 18px; margin-bottom: 6px; font-weight: 700; text-shadow: 0 2px 8px rgba(0,0,0,0.3); }
  .placeholder p { color: #ffb6d9; font-size: 13px; opacity: 0.9; }

  .flash {
    position: absolute; inset: 0;
    background: radial-gradient(circle, #fff 0%, #fff5fa 40%, transparent 70%);
    opacity: 0; pointer-events: none; z-index: 10;
  }
  .flash.on { animation: camFlash 0.55s ease-out; }
  @keyframes camFlash { 0%{opacity:0.92} 100%{opacity:0} }

  .loader {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    background: linear-gradient(135deg, rgba(255,182,217,0.97), rgba(192,132,252,0.97));
    color: white; padding: 12px 24px;
    border-radius: 24px; font-weight: 700; font-size: 15px;
    z-index: 9; display: none; text-align: center;
    box-shadow: 0 8px 22px rgba(255, 150, 200, 0.6);
    border: 2px solid rgba(255,255,255,0.3);
  }
  .loader.on { display: block; animation: pulse 0.7s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{transform:translate(-50%,-50%) scale(1)} 50%{transform:translate(-50%,-50%) scale(1.05)} }

  .panel {
    background: rgba(255, 255, 255, 0.9);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    flex-shrink: 0;
    border-radius: 20px 20px 0 0;
    box-shadow: 0 -4px 18px rgba(255, 150, 200, 0.25);
    padding: 8px 10px 10px;
    border-top: 2px solid rgba(255, 255, 255, 0.5);
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .controls {
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 2px;
  }
  .controls::-webkit-scrollbar { width: 3px; }
  .controls::-webkit-scrollbar-thumb { background: #ffd0e8; border-radius: 3px; }

  .section {
    text-align: center;
    color: #c9629a;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    margin: 4px 0 2px;
    opacity: 0.85;
  }

  .row {
    display: flex;
    gap: 5px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .chip {
    padding: 7px 11px;
    border-radius: 16px;
    border: 2px solid #ffb6d9;
    background: white;
    color: #c9629a;
    font-weight: 700;
    font-size: 11px;
    cursor: pointer;
    transition: all 0.12s;
    box-shadow: 0 1px 4px rgba(255, 182, 217, 0.25);
    font-family: inherit;
    white-space: nowrap;
  }
  .chip:active { transform: scale(0.9); }
  .chip.on {
    background: linear-gradient(135deg, #ff9ed8, #c084fc);
    color: white;
    border-color: transparent;
    box-shadow: 0 3px 10px rgba(255, 155, 217, 0.5);
    transform: scale(1.03);
  }

  .sticks {
    display: none;
    gap: 5px;
    justify-content: center;
    flex-wrap: wrap;
    padding: 6px 5px;
    background: linear-gradient(135deg, #fff5fa, #f0e6ff);
    border-radius: 14px;
    margin: 3px 0;
    border: 2px dashed #ffd0e8;
  }
  .sticks.on { display: flex; animation: slideUp 0.22s ease-out; }
  @keyframes slideUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

  .sticker {
    width: 40px; height: 40px;
    border-radius: 12px;
    border: 2px solid #ffd0e8;
    background: white;
    font-size: 22px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.1s;
    box-shadow: 0 2px 5px rgba(255, 182, 217, 0.3);
    touch-action: manipulation;
  }
  .sticker:active {
    background: #fff0f7;
    transform: scale(0.82) rotate(-5deg);
  }

  .actions {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 4px 0 2px;
    flex-shrink: 0;
  }

  .btn {
    border: none;
    border-radius: 50%;
    cursor: pointer;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.12s;
    position: relative;
    font-family: inherit;
    -webkit-tap-highlight-color: transparent;
    flex-shrink: 0;
  }
  .btn:active { transform: scale(0.86); }

  .shutter {
    width: 68px;
    height: 68px;
    background: linear-gradient(135deg, #ff9ed8 0%, #ff7bbf 50%, #c084fc 100%);
    font-size: 28px;
    border: 4px solid white;
    box-shadow:
      0 5px 16px rgba(255, 155, 217, 0.6),
      0 0 0 3px rgba(255, 255, 255, 0.35),
      inset 0 2px 3px rgba(255,255,255,0.4);
  }
  .shutter.added {
    box-shadow:
      0 0 0 5px rgba(255, 155, 217, 0.35),
      0 5px 16px rgba(255, 155, 217, 0.6),
      0 0 0 3px rgba(255, 255, 255, 0.35);
  }

  .side {
    width: 44px;
    height: 44px;
    font-size: 20px;
    background: linear-gradient(135deg, #ffd0e8, #f0c4ff);
    border: 3px solid white;
    box-shadow: 0 2px 8px rgba(255, 182, 217, 0.4);
  }
  .side.has-pics::after {
    content: '';
    position: absolute;
    top: -3px; right: -3px;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ff6b9d, #ff9ed8);
    border: 2px solid white;
    box-shadow: 0 1px 4px rgba(255, 107, 157, 0.6);
  }

  .modal {
    position: fixed; inset: 0;
    background: rgba(30, 22, 38, 0.7);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index: 50;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 14px;
  }
  .modal.on { display: flex; }
  .modal-box {
    background: white;
    border-radius: 20px;
    width: 100%;
    max-width: 360px;
    max-height: 78vh;
    max-height: 78dvh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 14px 40px rgba(0,0,0,0.3);
    border: 3px solid white;
    animation: popUp 0.28s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  @keyframes popUp {
    from { opacity: 0; transform: scale(0.88) translateY(20px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .modal-head {
    padding: 12px 16px;
    border-bottom: 2px solid #ffe0f0;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .modal-head h3 { color: #c9629a; font-size: 16px; font-weight: 700; }
  .modal-close {
    background: linear-gradient(135deg, #ffd0e8, #f0c4ff);
    border: none;
    border-radius: 50%;
    width: 30px; height: 30px;
    font-size: 14px;
    cursor: pointer;
    color: #c9629a;
    font-weight: bold;
    box-shadow: 0 2px 6px rgba(255, 182, 217, 0.4);
  }
  .modal-close:active { transform: scale(0.88); }
  .modal-body { padding: 10px; overflow-y: auto; -webkit-overflow-scrolling: touch; }

  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
    gap: 8px;
  }
  .photo {
    position: relative;
    border-radius: 12px;
    overflow: hidden;
    border: 2px solid #ffd0e8;
    aspect-ratio: 1;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(255, 182, 217, 0.3);
    transition: transform 0.12s;
    background: #f8f8f8;
  }
  .photo:active { transform: scale(0.94); }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo .act {
    position: absolute;
    bottom: 3px;
    width: 24px; height: 24px;
    border-radius: 50%;
    border: 2px solid white;
    font-size: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 1px 4px rgba(0,0,0,0.25);
  }
  .act:active { transform: scale(0.8); }
  .dl { background: #7dd3fc; color: white; right: 3px; }
  .rm { background: #ff9ed8; color: white; right: 30px; }
  .empty { grid-column: 1/-1; text-align: center; color: #c0a0b0; padding: 24px; font-size: 13px; }

  .sparkle {
    position: fixed;
    pointer-events: none;
    z-index: 100;
    font-size: 22px;
    animation: rise 1s ease-out forwards;
  }
  @keyframes rise {
    0% { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; }
    100% { transform: translateY(-110px) scale(0.3) rotate(160deg); opacity: 0; }
  }

  .drag-ghost {
    position: fixed;
    pointer-events: none;
    z-index: 200;
    font-size: 34px;
    transform: translate(-50%, -50%);
    filter: drop-shadow(0 3px 8px rgba(0,0,0,0.35));
    display: none;
  }

  .stick-indicator {
    position: absolute;
    top: 8px; right: 8px;
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(4px);
    padding: 4px 8px;
    border-radius: 12px;
    font-size: 10px;
    font-weight: 700;
    color: #c9629a;
    z-index: 8;
    display: none;
    box-shadow: 0 1px 6px rgba(255, 182, 217, 0.45);
  }
  .stick-indicator.show { display: block; }

  .safe-bottom { height: env(safe-area-inset-bottom, 4px); flex-shrink: 0; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>✨ Sparkle Cam ✨</h1>
  </div>

  <div class="screen-wrap">
    <div class="screen" id="screen">
      <video id="cam" autoplay playsinline muted style="display:none;"></video>
      <canvas id="show"></canvas>
      <canvas id="snap" style="display:none;"></canvas>

      <div class="placeholder" id="ph">
        <div class="ico">📷</div>
        <h3>Tap the camera!</h3>
        <p>Take the cutest photos ✨</p>
      </div>

      <div class="flash" id="flash"></div>
      <div class="loader" id="loader"><span style="font-size:20px;display:block;margin-bottom:2px;">📸</span>Developing...</div>
      <div class="stick-indicator" id="stickInd">Drag stickers ✨</div>
    </div>
  </div>

  <div class="panel">
    <div class="controls">
      <div class="section">Filters</div>
      <div class="row" id="filters">
        <button class="chip on" data-f="none">🌈 Normal</button>
        <button class="chip" data-f="sparkle">✨ Sparkle</button>
        <button class="chip" data-f="vintage">💜 Vintage</button>
        <button class="chip" data-f="pop">🎀 Pop</button>
        <button class="chip" data-f="dreamy">💕 Dreamy</button>
        <button class="chip" data-f="bw">🖤 B&W</button>
      </div>

      <div class="section">Frames</div>
      <div class="row" id="frames">
        <button class="chip on" data-f="none">✨ None</button>
        <button class="chip" data-f="polaroid">📷 Polaroid</button>
        <button class="chip" data-f="cute">🌸 Cute</button>
        <button class="chip" data-f="glow">💫 Glow</button>
        <button class="chip" data-f="rainbow">🌈 Rainbow</button>
        <button class="chip" data-f="neon">💜 Neon</button>
      </div>

      <button class="chip" id="stickToggle" style="margin:4px auto;display:block;min-width:130px;font-size:12px;">
        🎨 Stickers <span id="stickCount">(0)</span>
      </button>

      <div class="sticks" id="sticks">
        <button class="sticker" data-s="💖">💖</button>
        <button class="sticker" data-s="⭐">⭐</button>
        <button class="sticker" data-s="🦄">🦄</button>
        <button class="sticker" data-s="🐱">🐱</button>
        <button class="sticker" data-s="🎀">🎀</button>
        <button class="sticker" data-s="🌸">🌸</button>
        <button class="sticker" data-s="🌈">🌈</button>
        <button class="sticker" data-s="🦋">🦋</button>
        <button class="sticker" data-s="🌷">🌷</button>
        <button class="sticker" data-s="💝">💝</button>
        <button class="sticker" data-s="👑">👑</button>
        <button class="sticker" data-s="🧁">🧁</button>
        <button class="sticker" data-s="🍓">🍓</button>
        <button class="sticker" data-s="💅">💅</button>
        <button class="sticker" data-s="👛">👛</button>
        <button class="sticker" data-s="🎠">🎠</button>
      </div>
    </div>

    <div class="actions">
      <button class="btn side" id="flipBtn" title="Flip Camera">🔄</button>
      <button class="btn side" id="galBtn">🖼️</button>
      <button class="btn shutter" id="shutter">📸</button>
      <button class="btn side" id="clearBtn">🗑️</button>
    </div>
  </div>

  <div class="safe-bottom"></div>
</div>

<div class="modal" id="modal">
  <div class="modal-box">
    <div class="modal-head">
      <h3>🖼️ My Photos</h3>
      <button class="modal-close" id="closeModal">✕</button>
    </div>
    <div class="modal-body">
      <div class="gallery" id="gallery"></div>
    </div>
  </div>
</div>

<div class="drag-ghost" id="dragGhost"></div>

<script>
(function(){
  const video = document.getElementById('cam');
  const show = document.getElementById('show');
  const ctx = show.getContext('2d');
  const snap = document.getElementById('snap');
  const sctx = snap.getContext('2d');
  const screen = document.getElementById('screen');
  const ph = document.getElementById('ph');
  const flash = document.getElementById('flash');
  const loader = document.getElementById('loader');
  const modal = document.getElementById('modal');
  const gallery = document.getElementById('gallery');
  const sticks = document.getElementById('sticks');
  const stickToggle = document.getElementById('stickToggle');
  const stickCountEl = document.getElementById('stickCount');
  const stickInd = document.getElementById('stickInd');
  const galBtn = document.getElementById('galBtn');
  const shutter = document.getElementById('shutter');
  const clearBtn = document.getElementById('clearBtn');
  const flipBtn = document.getElementById('flipBtn');
  const dragGhost = document.getElementById('dragGhost');

  let stream = null;
  let photos = [];
  let filter = 'none';
  let frame = 'none';
  let stickers = [];
  let sticksOpen = false;
  let viewing = false;
  let rafId = null;
  let facingMode = 'environment';
  let cw = 0, ch = 0;

  // Drag state
  let dragging = null;
  let dragStartTime = 0;

  function size(){
    const r = screen.getBoundingClientRect();
    cw = Math.floor(r.width);
    ch = Math.floor(r.height);
    show.width = cw;
    show.height = ch;
    snap.width = cw;
    snap.height = ch;
  }

  function stopLoop(){
    if(rafId){ cancelAnimationFrame(rafId); rafId = null; }
  }

  function stopCamera(){
    if(stream){
      stream.getTracks().forEach(t => t.stop());
      stream = null;
    }
    stopLoop();
    video.style.display = 'none';
    show.style.display = 'none';
    snap.style.display = 'none';
    ph.style.display = 'flex';
  }

  function startCamera(){
    if(stream){
      video.srcObject = stream;
      video.style.display = 'none';
      ph.style.display = 'none';
      show.style.display = 'block';
      if(!rafId) drawLoop();
      return;
    }
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: facingMode,
        width: { ideal: 1280 },
        height: { ideal: 720 }
      }
    }).then(s => {
      stream = s;
      video.srcObject = stream;
      video.style.display = 'none';
      ph.style.display = 'none';
      show.style.display = 'block';
      size();
      drawLoop();
    }).catch(() => {
      ph.querySelector('h3').textContent = '📸 Tap camera to start!';
      ph.querySelector('p').textContent = 'Allow camera access for magic ✨';
    });
  }

  function flipCamera(){
    facingMode = (facingMode === 'environment') ? 'user' : 'environment';
    stopLoop();
    stopCamera();
    setTimeout(() => {
      startCamera();
      flipBtn.style.transform = 'scale(0.75) rotate(-20deg)';
      setTimeout(() => flipBtn.style.transform = '', 160);
    }, 120);
  }

  // Draw video with "cover" fit (no squashing)
  function drawVideoCover(ctx, vid, x, y, w, h){
    const vw = vid.videoWidth || w;
    const vh = vid.videoHeight || h;
    if(!vw || !vh){
      ctx.drawImage(vid, x, y, w, h);
      return;
    }
    const imgRatio = vw / vh;
    const canvasRatio = w / h;
    let sx, sy, sw, sh;
    if(imgRatio > canvasRatio){
      sh = vh;
      sw = sh * canvasRatio;
      sx = (vw - sw) / 2;
      sy = 0;
    } else {
      sw = vw;
      sh = sw / canvasRatio;
      sx = 0;
      sy = (vh - sh) / 2;
    }
    ctx.drawImage(vid, sx, sy, sw, sh, x, y, w, h);
  }

  // --- FILTERS ---
  function applyFilter(ctx, w, h){
    if(filter === 'none') return;
    const img = ctx.getImageData(0,0,w,h);
    const d = img.data;
    if(filter === 'sparkle'){
      for(let i=0;i<d.length;i+=4){
        d[i]=Math.min(255,d[i]*1.25);
        d[i+1]=Math.min(255,d[i+1]*1.1);
        d[i+2]=Math.min(255,d[i+2]*1.3);
      }
    } else if(filter === 'vintage'){
      for(let i=0;i<d.length;i+=4){
        const a=(d[i]+d[i+1]+d[i+2])/3;
        d[i]=Math.min(255,d[i]*0.85+a*0.25+25);
        d[i+1]=Math.min(255,d[i+1]*0.75+a*0.15+15);
        d[i+2]=Math.min(255,d[i+2]*0.65+10);
      }
    } else if(filter === 'pop'){
      for(let i=0;i<d.length;i+=4){
        d[i]=Math.min(255,d[i]*1.15+20);
        d[i+1]=Math.min(255,d[i+1]*1.05);
        d[i+2]=Math.min(255,d[i+2]*1.2+10);
      }
    } else if(filter === 'dreamy'){
      for(let i=0;i<d.length;i+=4){
        d[i]=Math.min(255,d[i]*1.1+30);
        d[i+1]=Math.min(255,d[i+1]*0.95+20);
        d[i+2]=Math.min(255,d[i+2]*1.15+35);
      }
    } else if(filter === 'bw'){
      for(let i=0;i<d.length;i+=4){
        const a=d[i]*0.299+d[i+1]*0.587+d[i+2]*0.114;
        d[i]=d[i+1]=d[i+2]=a;
      }
    }
    ctx.putImageData(img,0,0);
  }

  // --- FRAMES ---
  function drawFrame(ctx, w, h){
    if(frame === 'none') return;
    const colors = ['#ff9ed8','#c084fc','#7dd3fc','#ffd700','#ff6b9d','#34d399'];
    const t = Date.now();

    if(frame === 'polaroid'){
      ctx.strokeStyle='#fff'; ctx.lineWidth=20;
      ctx.strokeRect(8,8,w-16,h-16);
      ctx.fillStyle='#fff'; ctx.fillRect(w/2-50,h-58,100,30);
      ctx.fillStyle='#ff9ed8'; ctx.font='bold 15px sans-serif'; ctx.textAlign='center';
      ctx.fillText('💖',w/2,h-34);
    } else if(frame === 'cute'){
      ctx.strokeStyle='#ffb6d9'; ctx.lineWidth=16;
      ctx.setLineDash([14,8]); ctx.lineCap='round';
      ctx.strokeRect(8,8,w-16,h-16);
      ctx.setLineDash([]);
    } else if(frame === 'glow'){
      const c=colors[Math.floor(t/350)%colors.length];
      ctx.strokeStyle=c; ctx.lineWidth=8+Math.sin(t/150)*4;
      ctx.shadowColor=c; ctx.shadowBlur=16;
      ctx.strokeRect(6,6,w-12,h-12);
      ctx.shadowBlur=0;
    } else if(frame === 'rainbow'){
      const rainbow=['#ff9ed8','#ffd0e8','#fff5fa','#d5f5ff','#c084fc','#ff9ed8'];
      rainbow.forEach((c,i)=>{
        ctx.strokeStyle=c; ctx.lineWidth=3;
        ctx.strokeRect(3+i*3,3+i*3,w-6-i*6,h-6-i*6);
      });
    } else if(frame === 'neon'){
      ctx.strokeStyle='#ff6b9d'; ctx.lineWidth=4;
      ctx.shadowColor='#ff6b9d'; ctx.shadowBlur=12;
      ctx.strokeRect(6,6,w-12,h-12);
      ctx.shadowBlur=0;
      ctx.strokeStyle='#c084fc'; ctx.lineWidth=2;
      ctx.shadowColor='#c084fc'; ctx.shadowBlur=12;
      ctx.strokeRect(13,13,w-26,h-26);
      ctx.shadowBlur=0;
    }
  }

  // --- STICKERS ---
  function drawStickers(ctx, w, h){
    stickers.forEach((s, i) => {
      const fontSize = Math.max(24, Math.floor(w * s.size));
      ctx.font = fontSize + 'px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      if(dragging && dragging.index === i){
        ctx.save();
        ctx.shadowColor = 'rgba(255,255,255,0.9)';
        ctx.shadowBlur = 18;
        ctx.strokeStyle = 'rgba(255,255,255,0.8)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(s.x * w, s.y * h, fontSize * 0.7, 0, Math.PI*2);
        ctx.stroke();
        ctx.restore();
      }

      ctx.shadowColor = 'rgba(0,0,0,0.35)';
      ctx.shadowBlur = 8;
      ctx.fillText(s.emoji, s.x * w, s.y * h);
      ctx.shadowBlur = 0;
    });
  }

  function updateStickerCount(){
    stickCountEl.textContent = '(' + stickers.length + ')';
    stickInd.classList.toggle('show', stickers.length > 0);
  }

  function drawScene(target, w, h){
    target.clearRect(0,0,w,h);
    drawVideoCover(target, video, 0, 0, w, h);
    applyFilter(target, w, h);
    drawFrame(target, w, h);
    drawStickers(target, w, h);
  }

  function drawLoop(){
    if(viewing || !stream){ rafId = null; return; }
    drawScene(ctx, cw, ch);
    show.style.display = 'block';
    rafId = requestAnimationFrame(drawLoop);
  }

  function shoot(){
    if(viewing){
      viewing = false;
      snap.style.display = 'none';
      show.style.display = 'block';
      drawLoop();
      return;
    }
    if(!stream){ startCamera(); return; }

    flash.classList.add('on');
    setTimeout(() => flash.classList.remove('on'), 550);
    loader.classList.add('on');

    setTimeout(() => {
      drawScene(sctx, cw, ch);
      loader.classList.remove('on');

      photos.push({
        data: snap.toDataURL('image/jpeg', 0.92),
        time: new Date().toLocaleTimeString(),
        filter, frame,
        stickers: stickers.map(s => ({...s}))
      });

      spawnSparkles();
      updateStickerCount();
      save();
    }, 850);
  }

  function spawnSparkles(){
    const sym = ['⭐','✨','💖','🌟','💫','🦄','🌈','💕','🎀','🌸'];
    for(let i=0; i<14; i++){
      const s = document.createElement('div');
      s.className = 'sparkle';
      s.textContent = sym[Math.floor(Math.random()*sym.length)];
      s.style.left = (5 + Math.random()*90) + 'vw';
      s.style.top = (10 + Math.random()*80) + 'vh';
      s.style.fontSize = (20 + Math.random()*20) + 'px';
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 1000);
    }
  }

  // --- DRAG STICKERS ---
  function getPos(e){
    if(e.touches && e.touches.length) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    if(e.changedTouches && e.changedTouches.length) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
    return { x: e.clientX, y: e.clientY };
  }

  function findStickerAt(cx, cy){
    const rect = screen.getBoundingClientRect();
    const x = (cx - rect.left) / rect.width;
    const y = (cy - rect.top) / rect.height;
    for(let i = stickers.length - 1; i >= 0; i--){
      const s = stickers[i];
      const fontSize = Math.max(24, Math.floor(cw * s.size));
      const dx = (s.x*cw) - (x*cw);
      const dy = (s.y*ch) - (y*ch);
      if(Math.sqrt(dx*dx + dy*dy) < fontSize * 1.3) return i;
    }
    return -1;
  }

  function onDragStart(e){
    if(!stream || viewing) return;
    const pos = getPos(e);
    const idx = findStickerAt(pos.x, pos.y);
    if(idx === -1) return;
    e.preventDefault();
    dragging = { index: idx, startX: pos.x, startY: pos.y, origX: stickers[idx].x, origY: stickers[idx].y };
    dragStartTime = Date.now();
    dragGhost.textContent = stickers[idx].emoji;
    dragGhost.style.display = 'block';
    dragGhost.style.left = pos.x + 'px';
    dragGhost.style.top = pos.y + 'px';
  }

  function onDragMove(e){
    if(!dragging) return;
    e.preventDefault();
    const pos = getPos(e);
    dragGhost.style.left = pos.x + 'px';
    dragGhost.style.top = pos.y + 'px';
    const rect = screen.getBoundingClientRect();
    let nx = (pos.x - rect.left) / rect.width;
    let ny = (pos.y - rect.top) / rect.height;
    nx = Math.max(0.15, Math.min(0.85, nx));
    ny = Math.max(0.15, Math.min(0.85, ny));
    stickers[dragging.index].x = nx;
    stickers[dragging.index].y = ny;
  }

  function onDragEnd(e){
    if(!dragging) return;
    const pos = getPos(e);
    dragGhost.style.display = 'none';
    const dx = pos.x - dragging.startX;
    const dy = pos.y - dragging.startY;
    if(Math.abs(dx) < 6 && Math.abs(dy) < 6 && (Date.now() - dragStartTime) < 220){
      stickers[dragging.index].x = dragging.origX;
      stickers[dragging.index].y = dragging.origY;
    }
    dragging = null;
  }

  screen.addEventListener('mousedown', onDragStart);
  screen.addEventListener('mousemove', onDragMove);
  window.addEventListener('mouseup', onDragEnd);
  screen.addEventListener('touchstart', onDragStart, { passive: false });
  screen.addEventListener('touchmove', onDragMove, { passive: false });
  window.addEventListener('touchend', onDragEnd);

  // --- CONTROLS ---
  document.getElementById('filters').addEventListener('click', e => {
    if(e.target.classList.contains('chip')){
      filter = e.target.dataset.f;
      document.querySelectorAll('#filters .chip').forEach(c => c.classList.remove('on'));
      e.target.classList.add('on');
    }
  });

  document.getElementById('frames').addEventListener('click', e => {
    if(e.target.classList.contains('chip')){
      frame = e.target.dataset.f;
      document.querySelectorAll('#frames .chip').forEach(c => c.classList.remove('on'));
      e.target.classList.add('on');
    }
  });

  stickToggle.addEventListener('click', () => {
    sticksOpen = !sticksOpen;
    sticks.classList.toggle('on', sticksOpen);
    shutter.classList.toggle('added', sticksOpen);
  });

  document.querySelectorAll('.sticker').forEach(btn => {
    btn.addEventListener('click', () => {
      const emoji = btn.dataset.s;
      const spread = 0.25;
      const x = 0.5 + (Math.random()-0.5)*spread;
      const y = 0.5 + (Math.random()-0.5)*spread;
      stickers.push({
        emoji,
        x: Math.max(0.2, Math.min(0.8, x)),
        y: Math.max(0.2, Math.min(0.8, y)),
        size: 0.1
      });
      updateStickerCount();
      btn.style.transform = 'scale(0.6)';
      setTimeout(() => btn.style.transform = '', 120);
    });
  });

  clearBtn.addEventListener('click', () => {
    if(!stickers.length) return;
    stickers = [];
    updateStickerCount();
    clearBtn.style.transform = 'scale(0.7) rotate(-10deg)';
    setTimeout(() => clearBtn.style.transform = '', 180);
  });

  shutter.addEventListener('click', shoot);
  flipBtn.addEventListener('click', flipCamera);

  galBtn.addEventListener('click', openGallery);
  document.getElementById('closeModal').addEventListener('click', closeGallery);
  modal.addEventListener('click', e => { if(e.target === modal) closeGallery(); });

  function openGallery(){
    renderGallery();
    modal.classList.add('on');
    galBtn.classList.add('has-pics');
  }
  function closeGallery(){ modal.classList.remove('on'); }

  function renderGallery(){
    gallery.innerHTML = '';
    if(!photos.length){
      gallery.innerHTML = '<div class="empty">No photos yet!<br>Start snapping! 📸</div>';
      return;
    }
    [...photos].reverse().forEach((p, idx) => {
      const i = photos.length - 1 - idx;
      const card = document.createElement('div');
      card.className = 'photo';
      card.innerHTML =
        '<img src="' + p.data + '">' +
        '<button class="act rm" data-i="' + i + '">🗑️</button>' +
        '<button class="act dl" data-i="' + i + '">⬇️</button>';
      card.addEventListener('click', e => {
        if(e.target.tagName === 'BUTTON') return;
        viewPhoto(i);
      });
      gallery.appendChild(card);
    });
    gallery.querySelectorAll('.rm').forEach(b => b.addEventListener('click', () => deletePhoto(+b.dataset.i)));
    gallery.querySelectorAll('.dl').forEach(b => b.addEventListener('click', () => downloadPhoto(+b.dataset.i)));
  }

  function viewPhoto(i){
    viewing = true;
    stopLoop();
    const img = new Image();
    img.onload = () => {
      drawScene(sctx, cw, ch);
      snap.style.display = 'block';
      show.style.display = 'none';
      closeGallery();
    };
    img.src = photos[i].data;
  }

  function deletePhoto(i){
    photos.splice(i,1);
    renderGallery();
    save();
    if(!photos.length) galBtn.classList.remove('has-pics');
  }

  function downloadPhoto(i){
    const a = document.createElement('a');
    a.href = photos[i].data;
    a.download = 'sparkle-photo-' + (i+1) + '.jpg';
    a.click();
  }

  function save(){ try{ localStorage.setItem('sparklePhotos', JSON.stringify(photos)); } catch(e){} }
  function load(){
    try{
      const d = localStorage.getItem('sparklePhotos');
      if(d){
        photos = JSON.parse(d);
        if(photos.length) galBtn.classList.add('has-pics');
      }
    } catch(e){}
  }

  window.addEventListener('resize', () => {
    if(stream && !viewing) size();
  });

  setTimeout(() => {
    size();
    startCamera();
    load();
  }, 300);
})();
</script>
</body>
</html>
